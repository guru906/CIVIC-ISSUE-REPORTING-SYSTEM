
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Portal | CivicCare</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand">CivicCare</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="citizen.html">Citizen Portal</a>
    </nav>
    <select id="languageSelect" aria-label="Choose language">
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
    </select>
  </header>

  <main class="hero">
    <p class="eyebrow">CITIZEN SERVICES</p>
    <h1 data-en="Report a Civic Issue"
        data-ta="பொதுப் பிரச்சினையைப் பதிவு செய்யுங்கள்">
      Report a Civic Issue
    </h1>
    <p class="hero-text"
       data-en="Tell us about a problem in your area."
       data-ta="உங்கள் பகுதியில் உள்ள பிரச்சினையைப் பற்றி தெரிவியுங்கள்.">
      Tell us about a problem in your area.
    </p>

    <form id="complaintForm" class="complaint-form">
      <label for="title">Complaint title</label>
      <input id="title" name="title" required
        placeholder="e.g. Garbage overflow">

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">Select category</option>
        <option value="Sanitation">Garbage / Sanitation</option>
        <option value="Roads">Damaged road</option>
        <option value="Drainage">Drainage problem</option>
        <option value="Streetlights">Streetlight problem</option>
        <option value="Water Supply">Water supply</option>
        <option value="Other">Other</option>
      </select>

      <label for="location">Issue location</label>
      <input id="location" name="location" required
        placeholder="Street, area or landmark">

      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4"
        required placeholder="Explain the problem"></textarea>

      <label for="evidence">Photo evidence (optional)</label>
      <input id="evidence" name="evidence" type="file"
        accept="image/*">

      <button class="button primary" type="submit">
        Submit Complaint
      </button>
    </form>

    <section id="successMessage" hidden aria-live="polite"></section>
  </main>

  <section class="hero" id="track">
    <h2>Track Your Complaint</h2>
    <form id="trackingForm" class="complaint-form">
      <label for="trackingId">Complaint ID</label>
      <input id="trackingId" required
        placeholder="e.g. CIV-2026-0001">
      <button class="button primary" type="submit">
        Track
      </button>
    </form>
    <div id="trackingResult" aria-live="polite"></div>
  </section>
</body>
</html>
